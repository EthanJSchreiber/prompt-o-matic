# Writing Prompts
# ---------------
# Add or edit prompts below. Each entry needs:
#   - genre: one of [non-fiction, literary-fiction, fantasy, sci-fi, poetry]
#   - text:  the prompt itself
#
# Genres available in the UI map 1:1 to the `genre` field, so keep the strings
# identical. To add a new genre, also add it to the <select> in index.html.

tones:
  - pithy
  - snarky
  - dark
  - dramatic
  - matter-of-fact
  - melancholic
  - whimsical
  - sardonic
  - earnest
  - ominous
  - playful
  - contemplative
  - hopeful
  - bitter
  - nostalgic
  - urgent
  - dreamy
  - deadpan
  - tender
  - absurd

prompts:

  # ---------- non-fiction (20) ----------
  - genre: non-fiction
    text: Write about a moment when you realized you were wrong about something important.
  - genre: non-fiction
    text: Profile the most interesting stranger you have ever overheard in public.
  - genre: non-fiction
    text: Describe a place that no longer exists — a torn-down building, a closed business, a paved-over field.
  - genre: non-fiction
    text: Explain a job your grandparents did that does not really exist anymore.
  - genre: non-fiction
    text: Investigate the origin of an object on your desk right now.
  - genre: non-fiction
    text: Walk through the first thirty minutes after you wake up, in clinical detail.
  - genre: non-fiction
    text: Make a case for or against a popular opinion you secretly hold.
  - genre: non-fiction
    text: Write about a smell that always sends you somewhere else.
  - genre: non-fiction
    text: Trace the path of a single dollar bill through your week.
  - genre: non-fiction
    text: Describe a skill you have that you have never been paid for.
  - genre: non-fiction
    text: Reconstruct a conversation you wish had gone differently.
  - genre: non-fiction
    text: Document a routine you have never broken.
  - genre: non-fiction
    text: Profile someone in your life by their hands.
  - genre: non-fiction
    text: Write about the last time you cried in public.
  - genre: non-fiction
    text: Explain what your hometown does not have, and why that absence matters.
  - genre: non-fiction
    text: Describe a family recipe and what it costs to make.
  - genre: non-fiction
    text: Recount a time you lied to be polite.
  - genre: non-fiction
    text: Map your relationship to a body of water.
  - genre: non-fiction
    text: Describe what you keep in your wallet, item by item.
  - genre: non-fiction
    text: Write a personal essay disguised as a how-to guide.
  - genre: non-fiction
    text: Write about a song you cannot listen to anymore, and why.
  - genre: non-fiction
    text: Describe the worst job you have ever held and one thing you miss about it.
  - genre: non-fiction
    text: Profile a teacher who changed something about how you think.
  - genre: non-fiction
    text: Recount an argument you have replayed in your head more than once.
  - genre: non-fiction
    text: Write about a piece of advice you got too late.
  - genre: non-fiction
    text: Describe your bedroom at age twelve in such detail a stranger could draw it.
  - genre: non-fiction
    text: Trace the evolution of one of your handwriting habits.
  - genre: non-fiction
    text: Write about something you used to be afraid of and no longer are.
  - genre: non-fiction
    text: Make a list of things you have stolen, however small.
  - genre: non-fiction
    text: Describe a meal that fed more than just your hunger.
  - genre: non-fiction
    text: Profile a friendship that ended without a fight.
  - genre: non-fiction
    text: Write about the strangest thing you have ever found on a sidewalk.
  - genre: non-fiction
    text: Describe what your phone's recent searches reveal about you this month.
  - genre: non-fiction
    text: Write about a stranger's kindness you have never been able to repay.
  - genre: non-fiction
    text: Document the contents of your medicine cabinet as a self-portrait.
  - genre: non-fiction
    text: Recall the last thing you bought that you did not need but do not regret.
  - genre: non-fiction
    text: Describe a holiday tradition that died and what replaced it.
  - genre: non-fiction
    text: Write about a body part you have made peace with.
  - genre: non-fiction
    text: Profile the most argumentative person at your last family gathering.
  - genre: non-fiction
    text: Reconstruct the last lie you told yourself.

