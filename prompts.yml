    text: A man takes his daughter trick-or-treating in his ex-wife's new neighborhood.
  - genre: literary-fiction
    text: A woman returns to her hometown to bury a pet she rehomed years ago.
  - genre: literary-fiction
    text: A man inherits his estranged brother's dog and learns more from the dog than from the will.
  - genre: literary-fiction
    text: Two coworkers who have never spoken are stuck in an elevator for forty minutes.
  - genre: literary-fiction
    text: A teenager realizes their parent's "best friend" has always been more than that.
  - genre: literary-fiction
    text: A young woman moves into the apartment of someone who has just died.
  - genre: literary-fiction
    text: A man drives his teenage son to a college tour and they do not talk about anything important.
  - genre: literary-fiction
    text: A woman runs into her childhood babysitter at a hardware store, forty years later.
  - genre: literary-fiction
    text: A couple decides not to renew their lease, for different reasons.
  - genre: literary-fiction
    text: A daughter realizes during a phone call that her mother is starting to forget things.
  - genre: literary-fiction
    text: A man writes his father's eulogy and chooses to include the embarrassing parts.
  - genre: literary-fiction
    text: A woman finds a hidden compartment in a desk she bought at an estate sale.

